# Docker Compose cục bộ (LLD 9.1, lộ trình P1 bước 1).
# Chạy từ gốc repo:
#   cp deploy/.env.example deploy/.env      # rồi đặt mật khẩu
#   docker compose -f deploy/docker-compose.yml up -d            # db + flyway
#   docker compose -f deploy/docker-compose.yml --profile apps up -d --build
# Dịch vụ ứng dụng nằm trong profile "apps" vì entrypoint chưa được cài đặt.
name: pdca

x-app: &app
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: pdca-system:dev
  profiles: [apps]
  restart: unless-stopped
  depends_on:
    flyway:
      condition: service_completed_successfully
  environment: &app-env
    # Tài khoản pdca_app (LLD 2.3); quyền trên bảng do migration cấp.
    DATABASE_URL: postgresql://pdca_app:${PDCA_APP_PASSWORD:?đặt trong deploy/.env}@db:5432/pdca
    PDCA_ENV: ${PDCA_ENV:-dev}
    TZ_DEFAULT: ${TZ_DEFAULT:-Asia/Bangkok}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pdca
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?đặt trong deploy/.env}
      # Dùng bởi deploy/initdb/01-roles.sh khi khởi tạo volume lần đầu.
      FLYWAY_PASSWORD: ${FLYWAY_PASSWORD:?đặt trong deploy/.env}
      PDCA_APP_PASSWORD: ${PDCA_APP_PASSWORD:?đặt trong deploy/.env}
      PDCA_READONLY_PASSWORD: ${PDCA_READONLY_PASSWORD:?đặt trong deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports:
      # Chỉ mở trên loopback để chạy test/psql từ máy dev.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d pdca"]
      interval: 5s
      timeout: 5s
      retries: 20

  flyway:
    image: flyway/flyway:12-alpine
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/pdca
      FLYWAY_USER: flyway
      FLYWAY_PASSWORD: ${FLYWAY_PASSWORD:?đặt trong deploy/.env}
      # Dev nạp thêm seed (db/seed); staging/prod đặt FLYWAY_LOCATIONS=filesystem:/flyway/sql.
      FLYWAY_LOCATIONS: ${FLYWAY_LOCATIONS:-filesystem:/flyway/sql,filesystem:/flyway/seed}
      FLYWAY_CONNECT_RETRIES: "10"
    volumes:
      - ../db/migration:/flyway/sql:ro
      - ../db/seed:/flyway/seed:ro
    depends_on:
      db:
        condition: service_healthy

  mcp:
    <<: *app
    command: ["python", "-m", "apps.mcp_server"]

  agent:
    <<: *app
    command: ["python", "-m", "apps.agent_service"]
    environment:
      <<: *app-env
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL_SMALL: ${LLM_MODEL_SMALL:-}
      LLM_MODEL_MEDIUM: ${LLM_MODEL_MEDIUM:-}
      LLM_MODEL_LARGE: ${LLM_MODEL_LARGE:-}
      LLM_MONTHLY_BUDGET_USD: ${LLM_MONTHLY_BUDGET_USD:-}
      CHANNEL_KIND: ${CHANNEL_KIND:-}
      CHANNEL_CREDENTIALS: ${CHANNEL_CREDENTIALS:-}
      RULES_REPO_URL: ${RULES_REPO_URL:-}
      RULES_REF: ${RULES_REF:-}

  scheduler:
    <<: *app
    command: ["python", "-m", "apps.scheduler"]

  proxy:
    image: caddy:2-alpine
    profiles: [apps]
    restart: unless-stopped
    environment:
      PDCA_DOMAIN: ${PDCA_DOMAIN:-localhost}
    ports:
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [mcp]

volumes:
  pgdata: {}
  caddy_data: {}
