name: CI

# Luồng nhánh: phát triển trên `develop`, PR `develop` → `main` để release.
# Push lên `main` chạy kiểm tra rồi triển khai lên máy chủ (job `deploy`).
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Chỉ hủy lần chạy cũ của PR; không cắt ngang một lần triển khai trên main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0  # không có tag major trôi (v10)
        with:
          version: "0.12.21"
          enable-cache: true

      - name: Cài môi trường (khóa theo uv.lock)
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Rule trong plugin khớp rules/
        run: uv run pdca-admin rules build --check

      # Runner ubuntu có sẵn Docker nên test tích hợp (Testcontainers) chạy được tại đây.
      - name: Pytest
        run: uv run pytest

  # Triển khai: chỉ khi push lên main của chính repo (PR từ fork không bao giờ
  # chạy tới đây và không đọc được secret). Bí mật nằm trong environment
  # `production` trên GitHub, không có trong repo.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'langtuananh2424/pdca-system'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Kiểm tra secret đã đặt
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          missing=0
          for v in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS DEPLOY_PATH; do
            if [ -z "${!v}" ]; then echo "::error::Thiếu secret $v (environment production)"; missing=1; fi
          done
          exit $missing

      - name: Cấu hình SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Ghim khóa máy chủ, không tin lần đầu (TOFU).
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Cập nhật mã và khởi động lại stack trên máy chủ
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" \
            -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' SHA='$GITHUB_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          # Triển khai đúng commit vừa qua kiểm tra; deploy/.env (gitignore) giữ nguyên.
          git fetch --quiet origin main
          git checkout --quiet main
          git merge --ff-only "$SHA"
          docker compose -f deploy/docker-compose.yml --profile apps up -d --build --remove-orphans
          docker compose -f deploy/docker-compose.yml --profile apps ps
          docker image prune -f >/dev/null
          REMOTE

      - name: Dọn khóa SSH
        if: always()
        run: rm -f ~/.ssh/deploy_key
