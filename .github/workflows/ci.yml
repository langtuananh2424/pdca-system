name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0  # không có tag major trôi (v10)
        with:
          version: "0.12.21"
          enable-cache: true

      - name: Cài môi trường (khóa theo uv.lock)
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Rule trong plugin khớp rules/
        run: uv run pdca-admin rules build --check

      # Runner ubuntu có sẵn Docker nên test tích hợp (Testcontainers) chạy được tại đây.
      - name: Pytest
        run: uv run pytest
